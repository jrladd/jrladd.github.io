<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <script>
          (function() {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark' || theme === 'light') {
              document.documentElement.setAttribute('data-theme', theme);
            }
          })();
        </script>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>{{ page.title }}</title>
        <meta name="viewport" content="width=device-width">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💾</text></svg>">

        <link rel="authorization_endpoint" href="https://indieauth.com/auth">
        <link rel="token_endpoint" href="https://tokens.indieauth.com/token">
        <link href="https://github.com/jrladd" rel="me">
        <link href="https://micro.blog/jrladd" rel="me" />

        <!-- syntax highlighting CSS -->
        <link rel="stylesheet" href="/css/syntax.css">

        <!-- Custom CSS -->
        <link rel="stylesheet" href="/css/main.css">

	<!-- Feed -->
	<link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.url }}/feed/">

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400;1,700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

  <link href="https://afeld.github.io/emoji-css/emoji.css" rel="stylesheet">
    </head>
    <body>

      {%- include header.html -%}

      <main>  
      {{ content }}
      </main>

      {%- include footer.html -%}

      <script>
        (function() {
          var btn = document.getElementById('theme-toggle');
          if (!btn) return;

          function resolvedTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            if (current === 'dark' || current === 'light') return current;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }

          function render() {
            var theme = resolvedTheme();
            // Icon shows the mode a click will switch to.
            btn.textContent = theme === 'dark' ? '☀️' : '🌙';
            var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
            btn.setAttribute('aria-label', label);
            btn.setAttribute('title', label);
          }

          btn.addEventListener('click', function() {
            var next = resolvedTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            render();
          });

          render();
        })();
      </script>

    </body>
</html>
